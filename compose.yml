services:
  identity-db:
    image: postgres:18.6-alpine
    container_name: pavex-identity-db

    environment:
      POSTGRES_DB: pavex_identity
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5433:5432"

    volumes:
      - identity_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: pavex-mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

  gateway-redis:
    image: redis:8.2-alpine
    container_name: pavex-gateway-redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "no"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  identity_postgres_data:
