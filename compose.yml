    environment:
      POSTGRES_DB: pavex_pricing
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5437:5432"

    volumes:
      - pricing_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_pricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  shipment-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_shipments
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5438:5432"

    volumes:
      - shipment_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_shipments"]
      interval: 5s
      timeout: 5s
      retries: 10

  operations-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_operations
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5439:5432"

    volumes:
      - operations_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_billing
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5440:5432"

    volumes:
      - billing_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_billing"]
      interval: 5s
