  notifications-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_notifications
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5442:5432"

    volumes:
      - notifications_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

  # Photos and attachments (proof of delivery, support attachments, avatars). Console: http://localhost:9001
  # MinIO no longer publishes community images (minio/minio is gone from Docker Hub); pgsty/minio keeps
  # building the same open-source server from its source.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      MINIO_ROOT_USER: pavex
      MINIO_ROOT_PASSWORD: pavex-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway-redis:
    image: redis:8.2-alpine

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "no"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine

    environment:
      RABBITMQ_DEFAULT_USER: pavex
      RABBITMQ_DEFAULT_PASS: pavex
      RABBITMQ_DEFAULT_VHOST: pavex

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  auth_postgres_data:
  identity_profile_postgres_data:
  partners_postgres_data:
  network_postgres_data:
  pricing_postgres_data:
  shipment_postgres_data:
  operations_postgres_data:
  billing_postgres_data:
  fleet_postgres_data:
  notifications_postgres_data:
  rabbitmq_data:
  minio_data:
