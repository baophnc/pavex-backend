services:
  auth-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_auth
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5433:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_identity
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5434:5432"

    volumes:
      # Do not reuse the pre-split identity volume: its Flyway history belongs
      # to the legacy combined Auth/Identity service.
      - identity_profile_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  partners-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_partners
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5435:5432"

    volumes:
      - partners_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_partners"]
      interval: 5s
      timeout: 5s
      retries: 10

  network-db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: pavex_network
      POSTGRES_USER: pavex
      POSTGRES_PASSWORD: pavex

    ports:
      - "5436:5432"

    volumes:
      - network_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavex -d pavex_network"]
      interval: 5s
      timeout: 5s
      retries: 10

  pricing-db:
