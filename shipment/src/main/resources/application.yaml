# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  application:
    name: shipment-service

  datasource:
    url: ${SHIPMENT_DB_URL:jdbc:postgresql://localhost:5438/pavex_shipments}
    username: ${SHIPMENT_DB_USERNAME:pavex}
    password: ${SHIPMENT_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shipments

  flyway:
    enabled: true

server:
  port: ${SHIPMENT_SERVER_PORT:8084}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/shipment/private.pem
    public-key: file:${pavex.keys-dir}/shipment/public.pem

shipment:
  integrations:
    pricing:
      service-url: ${PRICING_SERVICE_URL:http://pricing-service}
    partners:
      service-url: ${PARTNERS_SERVICE_URL:http://partners-service}
    network:
      service-url: ${NETWORK_SERVICE_URL:http://network-service}
    operations:
      service-url: ${OPERATIONS_SERVICE_URL:http://operations-service}
  control-tower:
    sent-not-arrived-after: ${SHIPMENT_CONTROL_SENT_NOT_ARRIVED_AFTER:PT4H}
    missing-arrival-scan-grace: ${SHIPMENT_CONTROL_MISSING_ARRIVAL_GRACE:PT20M}
    arrived-not-out-for-delivery-after: ${SHIPMENT_CONTROL_ARRIVED_NOT_OFD_AFTER:PT2H}
    shipment-stuck-after: ${SHIPMENT_CONTROL_STUCK_AFTER:PT12H}
    critical-overdue-after: ${SHIPMENT_CONTROL_CRITICAL_OVERDUE_AFTER:PT4H}
    route-deviation-lookback: ${SHIPMENT_CONTROL_ROUTE_DEVIATION_LOOKBACK:PT24H}
    delivery-proof-lookback: ${SHIPMENT_CONTROL_DELIVERY_PROOF_LOOKBACK:P2D}
    low-case-sla: ${SHIPMENT_CONTROL_LOW_CASE_SLA:PT24H}
    medium-case-sla: ${SHIPMENT_CONTROL_MEDIUM_CASE_SLA:PT8H}
    high-case-sla: ${SHIPMENT_CONTROL_HIGH_CASE_SLA:PT2H}
    critical-case-sla: ${SHIPMENT_CONTROL_CRITICAL_CASE_SLA:PT30M}
    require-signature-on-delivery: ${SHIPMENT_CONTROL_REQUIRE_SIGNATURE:false}

pavex:
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
