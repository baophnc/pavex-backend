# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: shipment-service

  # Proof-of-delivery photos from the courier app (the service caps them at 3 MB).
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB

  datasource:
    url: ${SHIPMENT_DB_URL:jdbc:postgresql://localhost:5438/pavex_shipments}
    username: ${SHIPMENT_DB_USERNAME:pavex}
    password: ${SHIPMENT_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shipments

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD:pavex}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SHIPMENT_SERVER_PORT:8084}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/shipment/private.pem
    public-key: file:${pavex.keys-dir}/shipment/public.pem

shipment:
  integrations:
    pricing:
      service-url: ${PRICING_SERVICE_URL:http://pricing-service}
    partners:
      service-url: ${PARTNERS_SERVICE_URL:http://partners-service}
    network:
      service-url: ${NETWORK_SERVICE_URL:http://network-service}
    operations:
      service-url: ${OPERATIONS_SERVICE_URL:http://operations-service}
  control-tower:
    sent-not-arrived-after: ${SHIPMENT_CONTROL_SENT_NOT_ARRIVED_AFTER:PT4H}
    missing-arrival-scan-grace: ${SHIPMENT_CONTROL_MISSING_ARRIVAL_GRACE:PT20M}
    arrived-not-out-for-delivery-after: ${SHIPMENT_CONTROL_ARRIVED_NOT_OFD_AFTER:PT2H}
    shipment-stuck-after: ${SHIPMENT_CONTROL_STUCK_AFTER:PT12H}
    critical-overdue-after: ${SHIPMENT_CONTROL_CRITICAL_OVERDUE_AFTER:PT4H}
    route-deviation-lookback: ${SHIPMENT_CONTROL_ROUTE_DEVIATION_LOOKBACK:PT24H}
    delivery-proof-lookback: ${SHIPMENT_CONTROL_DELIVERY_PROOF_LOOKBACK:P2D}
    low-case-sla: ${SHIPMENT_CONTROL_LOW_CASE_SLA:PT24H}
    medium-case-sla: ${SHIPMENT_CONTROL_MEDIUM_CASE_SLA:PT8H}
    high-case-sla: ${SHIPMENT_CONTROL_HIGH_CASE_SLA:PT2H}
    critical-case-sla: ${SHIPMENT_CONTROL_CRITICAL_CASE_SLA:PT30M}
    require-signature-on-delivery: ${SHIPMENT_CONTROL_REQUIRE_SIGNATURE:false}
  # Retries confirming Network capacity reservations. Network expires unconfirmed
  # reservations after network.capacity.unconfirmed-reservation-ttl (default 30 min).
  network-confirmation:
    poll-interval: ${SHIPMENT_NETWORK_CONFIRMATION_POLL_INTERVAL:PT30S}
    lookback: ${SHIPMENT_NETWORK_CONFIRMATION_LOOKBACK:PT24H}
    batch-size: ${SHIPMENT_NETWORK_CONFIRMATION_BATCH_SIZE:50}
  # Publishes shipments.outbox_events to RabbitMQ (routing key = event type), e.g. the
  # shipment.cash-collected and shipment.closed events money settlement is built from.
  messaging:
    exchange: ${SHIPMENT_MESSAGING_EXCHANGE:pavex.events}
  outbox:
    enabled: ${SHIPMENT_OUTBOX_ENABLED:true}
    batch-size: ${SHIPMENT_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${SHIPMENT_OUTBOX_POLL_INTERVAL_MS:2000}
    lock-duration: ${SHIPMENT_OUTBOX_LOCK_DURATION:PT30S}
    base-retry-delay: ${SHIPMENT_OUTBOX_BASE_RETRY_DELAY:PT5S}
    max-retry-delay: ${SHIPMENT_OUTBOX_MAX_RETRY_DELAY:PT5M}
    max-attempts: ${SHIPMENT_OUTBOX_MAX_ATTEMPTS:8}
    confirm-timeout: ${SHIPMENT_OUTBOX_CONFIRM_TIMEOUT:PT5S}

pavex:
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
