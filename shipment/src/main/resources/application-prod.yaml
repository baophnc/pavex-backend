spring:
  datasource:
    url: ${SHIPMENT_DB_URL}
    username: ${SHIPMENT_DB_USERNAME}
    password: ${SHIPMENT_DB_PASSWORD}

security:
  jwt:
    issuer: ${JWT_ISSUER}
    public-key: ${JWT_PUBLIC_KEY}
  service-jwt:
    issuer: ${SHIPMENT_SERVICE_JWT_ISSUER}
    private-key: ${SHIPMENT_SERVICE_JWT_PRIVATE_KEY}
    public-key: ${SHIPMENT_SERVICE_JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
