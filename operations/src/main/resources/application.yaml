# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  application:
    name: operations-service

  datasource:
    url: ${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5439/pavex_operations}
    username: ${OPERATIONS_DB_USERNAME:pavex}
    password: ${OPERATIONS_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: operations

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD:pavex}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${OPERATIONS_SERVER_PORT:8087}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${OPERATIONS_SERVICE_JWT_ISSUER:http://localhost:8087}
    ttl: ${OPERATIONS_SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/operations/private.pem
    public-key: file:${pavex.keys-dir}/operations/public.pem
  trusted-services:
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: file:${pavex.keys-dir}/shipment/public.pem
    billing:
      issuer: ${BILLING_SERVICE_JWT_ISSUER:http://localhost:8088}
      public-key: file:${pavex.keys-dir}/billing/public.pem
    fleet:
      issuer: ${FLEET_SERVICE_JWT_ISSUER:http://localhost:8089}
      public-key: file:${pavex.keys-dir}/fleet/public.pem

operations:
  dispatch:
    auto-assign-enabled: ${OPERATIONS_AUTO_ASSIGN_ENABLED:true}
  messaging:
    exchange: ${OPERATIONS_MESSAGING_EXCHANGE:pavex.events}
  outbox:
    enabled: ${OPERATIONS_OUTBOX_ENABLED:true}
    batch-size: ${OPERATIONS_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${OPERATIONS_OUTBOX_POLL_INTERVAL_MS:2000}
    lock-duration: ${OPERATIONS_OUTBOX_LOCK_DURATION:PT30S}
    base-retry-delay: ${OPERATIONS_OUTBOX_BASE_RETRY_DELAY:PT5S}
    max-retry-delay: ${OPERATIONS_OUTBOX_MAX_RETRY_DELAY:PT5M}
    max-attempts: ${OPERATIONS_OUTBOX_MAX_ATTEMPTS:8}
    confirm-timeout: ${OPERATIONS_OUTBOX_CONFIRM_TIMEOUT:PT5S}
  redispatch:
    enabled: ${OPERATIONS_REDISPATCH_ENABLED:true}
    batch-size: ${OPERATIONS_REDISPATCH_BATCH_SIZE:25}
    poll-interval-ms: ${OPERATIONS_REDISPATCH_POLL_INTERVAL_MS:5000}
  integrations:
    identity:
      service-url: ${IDENTITY_SERVICE_URL:http://identity-service}
    network:
      service-url: ${NETWORK_SERVICE_URL:http://network-service}

pavex:
  keys-dir: ${user.home}/.pavex/keys
  gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
