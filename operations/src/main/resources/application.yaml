# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: operations-service

  datasource:
    url: ${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5439/pavex_operations}
    username: ${OPERATIONS_DB_USERNAME:pavex}
    password: ${OPERATIONS_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: operations

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${OPERATIONS_SERVER_PORT:8087}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${OPERATIONS_SERVICE_JWT_ISSUER:http://localhost:8087}
    ttl: ${OPERATIONS_SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/operations/private.pem
    public-key: file:${pavex.keys-dir}/operations/public.pem
  trusted-services:
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: file:${pavex.keys-dir}/shipment/public.pem
    billing:
      issuer: ${BILLING_SERVICE_JWT_ISSUER:http://localhost:8088}
      public-key: file:${pavex.keys-dir}/billing/public.pem
    fleet:
      issuer: ${FLEET_SERVICE_JWT_ISSUER:http://localhost:8089}
      public-key: file:${pavex.keys-dir}/fleet/public.pem
    partners:
      issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
      public-key: file:${pavex.keys-dir}/partners/public.pem
    notifications:
      issuer: ${NOTIFICATIONS_SERVICE_JWT_ISSUER:http://localhost:8090}
      public-key: file:${pavex.keys-dir}/notifications/public.pem

operations:
  dispatch:
    auto-assign-enabled: ${OPERATIONS_AUTO_ASSIGN_ENABLED:true}
    # A job assigned automatically but not accepted within this time goes to someone else.
    accept-timeout: ${OPERATIONS_ACCEPT_TIMEOUT:PT15M}
  messaging:
    exchange: ${OPERATIONS_MESSAGING_EXCHANGE:pavex.events}
  outbox:
    enabled: ${OPERATIONS_OUTBOX_ENABLED:true}
    batch-size: ${OPERATIONS_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${OPERATIONS_OUTBOX_POLL_INTERVAL_MS:2000}
    lock-duration: ${OPERATIONS_OUTBOX_LOCK_DURATION:PT30S}
    base-retry-delay: ${OPERATIONS_OUTBOX_BASE_RETRY_DELAY:PT5S}
    max-retry-delay: ${OPERATIONS_OUTBOX_MAX_RETRY_DELAY:PT5M}
    max-attempts: ${OPERATIONS_OUTBOX_MAX_ATTEMPTS:8}
    confirm-timeout: ${OPERATIONS_OUTBOX_CONFIRM_TIMEOUT:PT5S}
  redispatch:
    enabled: ${OPERATIONS_REDISPATCH_ENABLED:true}
    batch-size: ${OPERATIONS_REDISPATCH_BATCH_SIZE:25}
    poll-interval-ms: ${OPERATIONS_REDISPATCH_POLL_INTERVAL_MS:5000}
  shifts:
    roster:
      # Keeps shifts and rosters for the coming week from the standing rotation (6 days on, 1 off).
      enabled: ${OPERATIONS_SHIFT_ROSTER_ENABLED:true}
      days-ahead: ${OPERATIONS_SHIFT_ROSTER_DAYS_AHEAD:7}
      interval: ${OPERATIONS_SHIFT_ROSTER_INTERVAL:PT1H}
      auto-check-out-after: ${OPERATIONS_SHIFT_AUTO_CHECK_OUT_AFTER:PT1H}
      # Testing: everyone gets a 00:00–24:00 shift every day, no day off.
      full-day: ${OPERATIONS_SHIFT_FULL_DAY:false}
  integrations:
    identity:
      service-url: ${IDENTITY_SERVICE_URL:http://identity-service}
    network:
      service-url: ${NETWORK_SERVICE_URL:http://network-service}

pavex:
  # Local demo only: lets an admin forget every shipment and what it produced (demo/DemoReset.kt).
  demo-reset:
    enabled: ${PAVEX_DEMO_RESET_ENABLED:false}
  keys-dir: ${user.home}/.pavex/keys
  gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
