spring:
  datasource:
    url: ${OPERATIONS_DB_URL}
    username: ${OPERATIONS_DB_USERNAME}
    password: ${OPERATIONS_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:pavex}

security:
  jwt:
    issuer: ${JWT_ISSUER}
    public-key: ${JWT_PUBLIC_KEY}
  service-jwt:
    issuer: ${OPERATIONS_SERVICE_JWT_ISSUER}
    private-key: ${OPERATIONS_SERVICE_JWT_PRIVATE_KEY}
    public-key: ${OPERATIONS_SERVICE_JWT_PUBLIC_KEY}
  trusted-services:
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER}
      public-key: ${SHIPMENT_SERVICE_JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
