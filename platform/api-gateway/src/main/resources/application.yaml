spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Keep this disabled on purpose. Only explicit routes below
              # are exposed publicly even if more services register in Eureka.
              enabled: false

          redis-route-definition-repository:
            # Redis is used only for rate limiting in this checkpoint.
            # Route definitions stay in version-controlled YAML.
            enabled: false

          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${GATEWAY_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-Request-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Replenish-Rate
                  - X-RateLimit-Burst-Capacity
                  - Retry-After
                allow-credentials: true
                max-age: 3600

          routes:
            # /api/v1/auth/** is mostly owned by Auth, but the current-user
            # profile endpoints are Identity-owned. Give these exact routes a
            # lower order value so they win before the Auth wildcard route.
            - id: identity-current-user-me
              order: -111
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/me
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-current-user-profile
              order: -110
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/me/profile
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: auth
              order: -100
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-users
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-roles
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/roles/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-profiles
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/identities/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

server:
  port: ${API_GATEWAY_PORT:8080}

# The gateway itself is a Eureka client. Service routes are
# resolved through Eureka + Spring Cloud LoadBalancer.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
