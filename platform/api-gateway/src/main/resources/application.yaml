spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Keep this disabled on purpose. Only explicit routes below
              # are exposed publicly even if more services register in Eureka.
              enabled: false

          redis-route-definition-repository:
            # Redis is used only for rate limiting in this checkpoint.
            # Route definitions stay in version-controlled YAML.
            enabled: false

          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${GATEWAY_ALLOWED_ORIGIN:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-Request-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Replenish-Rate
                  - X-RateLimit-Burst-Capacity
                  - Retry-After
                allow-credentials: true
                max-age: 3600

          routes:
            # Central OpenAPI aggregation. Swagger UI is served by the Gateway,
            # while each service remains the owner of its generated API spec.
            - id: auth-openapi
              order: -1000
              uri: lb://auth-service
              predicates:
                - Path=/openapi/auth
              filters:
                - SetPath=/v3/api-docs

            - id: identity-openapi
              order: -999
              uri: lb://identity-service
              predicates:
                - Path=/openapi/identity
              filters:
                - SetPath=/v3/api-docs

            - id: partners-openapi
              order: -998
              uri: lb://partners-service
              predicates:
                - Path=/openapi/partners
              filters:
                - SetPath=/v3/api-docs

            - id: network-openapi
              order: -997
              uri: lb://network-service
              predicates:
                - Path=/openapi/network
              filters:
                - SetPath=/v3/api-docs

            - id: pricing-openapi
              order: -996
              uri: lb://pricing-service
              predicates:
                - Path=/openapi/pricing
              filters:
                - SetPath=/v3/api-docs

            - id: shipment-openapi
              order: -995
              uri: lb://shipment-service
              predicates:
                - Path=/openapi/shipments
              filters:
                - SetPath=/v3/api-docs

            # /api/v1/auth/** is mostly owned by Auth, but the current-user
            # profile endpoints are Identity-owned. Give these exact routes a
            # lower order value so they win before the Auth wildcard route.
            - id: identity-current-user-me
              order: -111
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/me
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-current-user-profile
              order: -110
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/me/profile
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: auth
              order: -100
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST_CAPACITY:20}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-users
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-roles
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/roles/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-permissions
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/permissions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: identity-profiles
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/identities/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: partners-locations
              uri: lb://partners-service
              predicates:
                - Path=/api/v1/locations/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: partners-customer
              uri: lb://partners-service
              predicates:
                - Path=/api/v1/partners/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: partners-merchants
              uri: lb://partners-service
              predicates:
                - Path=/api/v1/merchants/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: partners-admin-merchants
              uri: lb://partners-service
              predicates:
                - Path=/api/v1/admin/merchants/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: network-api
              uri: lb://network-service
              predicates:
                - Path=/api/v1/network/**,/api/v1/admin/network/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_API_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_API_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

            - id: pricing-api
              uri: lb://pricing-service
              predicates:
                - Path=/api/v1/pricing/**,/api/v1/admin/pricing/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_PRICING_REPLENISH_RATE:20}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_PRICING_BURST_CAPACITY:40}
                    redis-rate-limiter.requestedTokens: 1

            - id: shipment-api
              uri: lb://shipment-service
              predicates:
                - Path=/api/v1/shipments/**,/api/v1/tracking/**,/api/v1/parcel-scans/**,/api/v1/deliveries/**,/api/v1/admin/shipments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_SHIPMENT_REPLENISH_RATE:30}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_SHIPMENT_BURST_CAPACITY:60}
                    redis-rate-limiter.requestedTokens: 1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Auth API
    urls:
      - name: Auth API
        url: /openapi/auth
      - name: Identity API
        url: /openapi/identity
      - name: Partners API
        url: /openapi/partners
      - name: Network API
        url: /openapi/network
      - name: Pricing API
        url: /openapi/pricing
      - name: Shipment API
        url: /openapi/shipments
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
    try-it-out-enabled: true
    filter: true


server:
  port: ${API_GATEWAY_PORT:8080}

# The gateway itself is a Eureka client. Service routes are
# resolved through Eureka + Spring Cloud LoadBalancer.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
