# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  application:
    name: discovery-server

server:
  port: ${DISCOVERY_SERVER_PORT:8761}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
