# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: billing-service

  datasource:
    url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5440/pavex_billing}
    username: ${BILLING_DB_USERNAME:pavex}
    password: ${BILLING_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: billing

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    listener:
      simple:
        # A message that still fails after the retries goes to the dead-letter queue
        # instead of being redelivered forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${BILLING_EVENTS_MAX_ATTEMPTS:5}
          initial-interval: 1s
          multiplier: 2
          max-interval: 30s

server:
  port: ${BILLING_SERVER_PORT:8088}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${BILLING_SERVICE_JWT_ISSUER:http://localhost:8088}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/billing/private.pem
    public-key: file:${pavex.keys-dir}/billing/public.pem

billing:
  integrations:
    partners:
      service-url: ${PARTNERS_SERVICE_URL:http://partners-service}
    operations:
      service-url: ${OPERATIONS_SERVICE_URL:http://operations-service}
  messaging:
    exchange: ${BILLING_EVENTS_EXCHANGE:pavex.events}
    shipment-queue: ${BILLING_SHIPMENT_QUEUE:billing.shipment-events}
  settlement:
    # Days a merchant has to pay the fee balance left after COD is offset.
    invoice-due-days: ${BILLING_INVOICE_DUE_DAYS:7}
  payments:
    # "fake" settles QR payments through the admin confirm endpoint; use "payos" in real environments.
    default-provider: ${BILLING_PAYMENT_PROVIDER:fake}
    qr:
      expires-in: ${BILLING_QR_EXPIRES_IN:PT15M}
      issuer: PVX
      # Signs the fake gateway's QR payload. At least 32 bytes.
      signing-key: ${BILLING_QR_SIGNING_KEY}
    payos:
      enabled: ${PAYOS_ENABLED:false}
      api-base-url: ${PAYOS_API_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      return-url: ${PAYOS_RETURN_URL:http://localhost:3000/account/billing}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/account/billing}
      timeout: ${PAYOS_TIMEOUT:PT15S}
    reconciliation:
      enabled: ${BILLING_RECONCILIATION_ENABLED:false}
      interval: ${BILLING_RECONCILIATION_INTERVAL:PT2M}
      minimum-age: ${BILLING_RECONCILIATION_MINIMUM_AGE:PT30S}
      batch-size: ${BILLING_RECONCILIATION_BATCH_SIZE:50}

pavex:
  # Local demo only: lets an admin forget every shipment and what it produced (demo/DemoReset.kt).
  demo-reset:
    enabled: ${PAVEX_DEMO_RESET_ENABLED:false}
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
