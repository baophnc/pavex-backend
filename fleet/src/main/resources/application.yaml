# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: fleet-service

  datasource:
    url: ${FLEET_DB_URL:jdbc:postgresql://localhost:5441/pavex_fleet}
    username: ${FLEET_DB_USERNAME:pavex}
    password: ${FLEET_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fleet

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${FLEET_EVENTS_MAX_ATTEMPTS:5}
          initial-interval: 1s
          multiplier: 2
          max-interval: 30s

server:
  port: ${FLEET_SERVER_PORT:8089}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${FLEET_SERVICE_JWT_ISSUER:http://localhost:8089}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/fleet/private.pem
    public-key: file:${pavex.keys-dir}/fleet/public.pem

fleet:
  integrations:
    operations:
      service-url: ${OPERATIONS_SERVICE_URL:http://operations-service}
    network:
      service-url: ${NETWORK_SERVICE_URL:http://network-service}
  tracking:
    # A trip with no position for this long is shown as "signal lost".
    signal-lost-after: ${FLEET_SIGNAL_LOST_AFTER:PT5M}
    # Raw GPS points are dropped with their daily partition after this many days.
    retention-days: ${FLEET_LOCATION_RETENTION_DAYS:30}
    # How often in-progress trips are checked for "every parcel received at the destination hub".
    arrival-check-interval: ${FLEET_ARRIVAL_CHECK_INTERVAL:PT1M}
  messaging:
    exchange: ${FLEET_EVENTS_EXCHANGE:pavex.events}
    shipment-queue: ${FLEET_SHIPMENT_QUEUE:fleet.shipment-events}
  # Moves every running truck along its lane when no phone sends its position, so the maps and
  # arrivals can be tested without driving. Local and test environments only.
  simulator:
    enabled: ${FLEET_SIMULATOR_ENABLED:false}
    # 60 km/h is 10 km every 10 minutes.
    speed-kmh: ${FLEET_SIMULATOR_SPEED_KMH:60}
    tick: ${FLEET_SIMULATOR_TICK:PT30S}

pavex:
  # Local demo only: lets an admin forget every shipment and what it produced (demo/DemoReset.kt).
  demo-reset:
    enabled: ${PAVEX_DEMO_RESET_ENABLED:false}
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
