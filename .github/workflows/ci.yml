name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configuration rules
        run: node --test scripts/tests/single-config.test.mjs
      # Docker is available on GitHub-hosted Ubuntu runners, so the PostgreSQL (Testcontainers) tests run too.
      - name: Maven test
        run: ./mvnw -B test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  deploy:
    name: Staging compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # deploy/compose.yml with the example settings and throwaway secrets must stay valid.
      - name: docker compose config
        run: |
          cp deploy/.env.example deploy/.env
          ./deploy/gen-secrets.sh
          docker compose -f deploy/compose.yml config --quiet

  docker:
    name: Docker image (${{ matrix.module }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # A smoke test of the shared Dockerfile: one business service and the gateway.
        module: [shipment, platform/api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: MODULE=${{ matrix.module }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
