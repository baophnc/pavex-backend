spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SMTP_USERNAME}
    password: ${GMAIL_SMTP_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

pavex:
  email:
    from: ${GMAIL_SMTP_FROM_EMAIL:${GMAIL_SMTP_USERNAME}}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    invitation-url: ${INVITATION_URL:http://localhost:3000/accept-invite}
