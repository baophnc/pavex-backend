# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/pavex_auth}
    username: ${AUTH_DB_USERNAME:pavex}
    password: ${AUTH_DB_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pavex}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:pavex}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          max-attempts: 5


server:
  port: 8081


security:
  # LOCAL ONLY: all launch methods share the same host key directory.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}

    access-token-ttl: PT15M

    refresh-token-ttl: P30D

    # Absolute cap for a refresh-token rotation chain, counted from the original login.
    refresh-session-max-lifetime: ${AUTH_REFRESH_SESSION_MAX_LIFETIME:P90D}

    private-key: file:${pavex.keys-dir}/auth/private.pem
    public-key: file:${pavex.keys-dir}/auth/public.pem

  service-jwt:
    ttl: ${SERVICE_JWT_TTL:PT1M}
    identity:
      issuer: ${IDENTITY_SERVICE_JWT_ISSUER:http://localhost:8082}
      public-key: file:${pavex.keys-dir}/identity/public.pem


auth:
  identity:
    service-url: ${IDENTITY_SERVICE_URL:http://identity-service}

  google:
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}

  staff-credentials:
    # Accounts an administrator creates start with this password; the holder must change it at the
    # first sign-in, and it stops working after the TTL (then: forgot password).
    temporary-password: ${STAFF_TEMPORARY_PASSWORD}
    temporary-password-ttl: ${STAFF_TEMPORARY_PASSWORD_TTL:PT72H}

  security:
    verification-token-ttl: PT24H
    verification-resend-cooldown: PT2M
    password-reset-token-ttl: PT1H
    invitation-token-ttl: PT24H
    # Base64 of at least 32 random bytes. Changing it signs every user out.
    key-hash-secret: ${AUTH_KEY_HASH_SECRET}

  cleanup:
    enabled: ${AUTH_CLEANUP_ENABLED:true}
    token-retention: ${AUTH_TOKEN_RETENTION:P7D}
    audit-retention: ${AUTH_AUDIT_RETENTION:P90D}
    cron: ${AUTH_CLEANUP_CRON:0 17 * * * *}
    zone: ${AUTH_CLEANUP_ZONE:UTC}

  messaging:
    exchange: ${AUTH_MESSAGING_EXCHANGE:pavex.events}
    email-consumer-enabled: ${AUTH_EMAIL_CONSUMER_ENABLED:true}

  outbox:
    publisher-enabled: ${AUTH_OUTBOX_PUBLISHER_ENABLED:true}
    poll-delay-ms: ${AUTH_OUTBOX_POLL_DELAY_MS:2000}
    batch-size: ${AUTH_OUTBOX_BATCH_SIZE:10}
    max-attempts: ${AUTH_OUTBOX_MAX_ATTEMPTS:100}
    confirm-timeout: ${AUTH_OUTBOX_CONFIRM_TIMEOUT:PT5S}
    published-retention: ${AUTH_OUTBOX_PUBLISHED_RETENTION:P7D}
    consumed-retention: ${AUTH_CONSUMED_MESSAGE_RETENTION:P30D}
    # Base64 of 32 random bytes. Changing it makes unsent outbox messages unreadable.
    payload-encryption-key: ${AUTH_OUTBOX_PAYLOAD_ENCRYPTION_KEY}


pavex:
  keys-dir: ${user.home}/.pavex/keys

  # First administrator, created at startup with the same id in Auth and Identity. Off unless
  # PAVEX_BOOTSTRAPADMIN_ENABLED=true; then PAVEX_BOOTSTRAPADMIN_PASSWORD is required. With
  # reset-password the configured password replaces the stored one at every start (local only).
  bootstrap-admin:
    enabled: ${PAVEX_BOOTSTRAPADMIN_ENABLED:false}
    id: '00000000-0000-0000-0000-000000000001'
    email: ${PAVEX_BOOTSTRAPADMIN_EMAIL:admin@pavex.com}
    password: ${PAVEX_BOOTSTRAPADMIN_PASSWORD:}
    reset-password: ${PAVEX_BOOTSTRAPADMIN_RESET_PASSWORD:false}
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}
  email:
    from: ${MAIL_FROM:no-reply@pavex.local}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    management-password-reset-url: ${MANAGEMENT_PASSWORD_RESET_URL:http://localhost:3001/reset-password}
    invitation-url: ${INVITATION_URL:http://localhost:3000/accept-invite}
    management-invitation-url: ${MANAGEMENT_INVITATION_URL:http://localhost:3001/accept-invite}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}

  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**


management:
  health:
    # Avoid a feedback loop where the client reports itself DOWN because its
    # just-registered remote Eureka status has not propagated yet.
    eureka:
      enabled: false
    rabbit:
      enabled: false

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
