security:
  jwt:
    issuer: http://localhost:8081
    private-key: classpath:keys/test-private.pem
    public-key: classpath:keys/test-public.pem
  service-jwt:
    ttl: PT1M
    identity:
      issuer: http://localhost:8082
      public-key: classpath:keys/test-public.pem

spring:
  datasource:
    url: jdbc:h2:mem:pavex_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

auth:
  security:
    key-hash-secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  messaging:
    email-consumer-enabled: false

  outbox:
    publisher-enabled: false
    payload-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

management:
  health:
    rabbit:
      enabled: false
