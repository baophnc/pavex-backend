spring:
  application:
    name: pricing-service

  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5437/pavex_pricing}
    username: ${PRICING_DB_USERNAME:pavex}
    password: ${PRICING_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pricing

  flyway:
    enabled: true

server:
  port: ${PRICING_SERVER_PORT:8086}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY:file:./auth/.keys/public.pem}

pricing:
  seed:
    demo:
      enabled: ${PRICING_DEMO_SEED_ENABLED:false}

pavex:
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
