# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: pricing-service

  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5437/pavex_pricing}
    username: ${PRICING_DB_USERNAME:pavex}
    password: ${PRICING_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pricing

  flyway:
    enabled: true

server:
  port: ${PRICING_SERVER_PORT:8086}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  service-jwt:
    issuer: ${PRICING_SERVICE_JWT_ISSUER:http://localhost:8086}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/pricing/private.pem
    public-key: file:${pavex.keys-dir}/pricing/public.pem
  trusted-services:
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: file:${pavex.keys-dir}/shipment/public.pem

pricing:
  network:
    service-url: ${NETWORK_SERVICE_URL:http://network-service}
  shipment:
    integration-enabled: ${PRICING_SHIPMENT_INTEGRATION_ENABLED:true}
  seed:
    demo:
      enabled: ${PRICING_DEMO_SEED_ENABLED:false}

pavex:
  # Local demo only: lets an admin forget every shipment and what it produced (demo/DemoReset.kt).
  demo-reset:
    enabled: ${PAVEX_DEMO_RESET_ENABLED:false}
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
