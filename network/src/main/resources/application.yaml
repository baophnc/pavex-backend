# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: network-service

  datasource:
    url: ${NETWORK_DB_URL:jdbc:postgresql://localhost:5436/pavex_network}
    username: ${NETWORK_DB_USERNAME:pavex}
    password: ${NETWORK_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: network

  flyway:
    enabled: true

server:
  port: ${NETWORK_SERVER_PORT:8085}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem
  trusted-services:
    pricing:
      issuer: ${PRICING_SERVICE_JWT_ISSUER:http://localhost:8086}
      public-key: file:${pavex.keys-dir}/pricing/public.pem
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: file:${pavex.keys-dir}/shipment/public.pem
    operations:
      issuer: ${OPERATIONS_SERVICE_JWT_ISSUER:http://localhost:8087}
      public-key: file:${pavex.keys-dir}/operations/public.pem
    fleet:
      issuer: ${FLEET_SERVICE_JWT_ISSUER:http://localhost:8089}
      public-key: file:${pavex.keys-dir}/fleet/public.pem
    partners:
      issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
      public-key: file:${pavex.keys-dir}/partners/public.pem

network:
  partners:
    service-url: ${PARTNERS_SERVICE_URL:http://partners-service}
  routing:
    transfer-buffer-minutes: ${NETWORK_TRANSFER_BUFFER_MINUTES:30}
    schedule-search-days: ${NETWORK_SCHEDULE_SEARCH_DAYS:30}
  capacity:
    reservation-retries: ${NETWORK_CAPACITY_RESERVATION_RETRIES:8}
    # Shipment must confirm a reservation within this window or it is released.
    unconfirmed-reservation-ttl: ${NETWORK_UNCONFIRMED_RESERVATION_TTL:PT30M}
    expiry-poll-interval: ${NETWORK_CAPACITY_EXPIRY_POLL_INTERVAL:PT1M}
    expiry-batch-size: ${NETWORK_CAPACITY_EXPIRY_BATCH_SIZE:50}
  seed:
    demo:
      # Off by default: scripts/seed-nationwide builds the real network (one post office per ward).
      enabled: ${NETWORK_DEMO_SEED_ENABLED:false}

pavex:
  # Local demo only: lets an admin forget every shipment and what it produced (demo/DemoReset.kt).
  demo-reset:
    enabled: ${PAVEX_DEMO_RESET_ENABLED:false}
  keys-dir: ${user.home}/.pavex/keys
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
