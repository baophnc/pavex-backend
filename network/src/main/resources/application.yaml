spring:
  application:
    name: network-service

  datasource:
    url: ${NETWORK_DB_URL:jdbc:postgresql://localhost:5436/pavex_network}
    username: ${NETWORK_DB_USERNAME:pavex}
    password: ${NETWORK_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: network

  flyway:
    enabled: true

server:
  port: ${NETWORK_SERVER_PORT:8085}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY:file:./auth/.keys/public.pem}
  trusted-services:
    pricing:
      issuer: ${PRICING_SERVICE_JWT_ISSUER:http://localhost:8086}
      public-key: ${PRICING_SERVICE_JWT_PUBLIC_KEY:file:./pricing/.keys/public.pem}
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: ${SHIPMENT_SERVICE_JWT_PUBLIC_KEY:file:./auth/.keys/public.pem}

network:
  partners:
    service-url: ${PARTNERS_SERVICE_URL:http://partners-service}
  routing:
    transfer-buffer-minutes: ${NETWORK_TRANSFER_BUFFER_MINUTES:30}
    schedule-search-days: ${NETWORK_SCHEDULE_SEARCH_DAYS:30}
  capacity:
    reservation-retries: ${NETWORK_CAPACITY_RESERVATION_RETRIES:8}
  seed:
    demo:
      enabled: ${NETWORK_DEMO_SEED_ENABLED:false}

pavex:
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
