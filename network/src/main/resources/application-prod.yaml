spring:
  datasource:
    url: ${NETWORK_DB_URL}
    username: ${NETWORK_DB_USERNAME}
    password: ${NETWORK_DB_PASSWORD}

security:
  jwt:
    issuer: ${JWT_ISSUER}
    public-key: ${JWT_PUBLIC_KEY}
  trusted-services:
    pricing:
      issuer: ${PRICING_SERVICE_JWT_ISSUER}
      public-key: ${PRICING_SERVICE_JWT_PUBLIC_KEY}
    shipment:
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER}
      public-key: ${SHIPMENT_SERVICE_JWT_PUBLIC_KEY}
    operations:
      issuer: ${OPERATIONS_SERVICE_JWT_ISSUER}
      public-key: ${OPERATIONS_SERVICE_JWT_PUBLIC_KEY}

network:
  seed:
    demo:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
