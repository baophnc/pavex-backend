# Production must supply Auth's public verification key explicitly.
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  service-jwt:
    private-key: ${PARTNERS_SERVICE_JWT_PRIVATE_KEY}
    public-key: ${PARTNERS_SERVICE_JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
