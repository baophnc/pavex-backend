spring:
  application:
    name: partners-service

  datasource:
    url: ${PARTNERS_DB_URL:jdbc:postgresql://localhost:5435/pavex_partners}
    username: ${PARTNERS_DB_USERNAME:pavex}
    password: ${PARTNERS_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: partners

  flyway:
    enabled: true

server:
  port: ${PARTNERS_SERVER_PORT:8083}

security:
  # Auth remains the issuer of public user access tokens. Partners validates
  # those tokens locally and never calls Auth on the request hot path.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY:file:./auth/.keys/public.pem}

  # Partners signs short-lived service tokens with its own key pair. Identity
  # trusts only the public half and only for the identity.merchant scope.
  service-jwt:
    issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: ${PARTNERS_SERVICE_JWT_PRIVATE_KEY:file:./partners/.keys/private.pem}
    public-key: ${PARTNERS_SERVICE_JWT_PUBLIC_KEY:file:./partners/.keys/public.pem}

  trusted-services:
    shipment:
      # Shipment will own this key pair when that service is introduced. The
      # local default keeps the contract testable without weakening claim,
      # audience or scope validation.
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: ${SHIPMENT_SERVICE_JWT_PUBLIC_KEY:file:./partners/.keys/public.pem}

partners:
  identity:
    service-url: ${IDENTITY_SERVICE_URL:http://identity-service}

pavex:
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
