# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: partners-service

  datasource:
    url: ${PARTNERS_DB_URL:jdbc:postgresql://localhost:5435/pavex_partners}
    username: ${PARTNERS_DB_USERNAME:pavex}
    password: ${PARTNERS_DB_PASSWORD:pavex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: partners

  flyway:
    enabled: true

  # Claim evidence: up to five files of 5 MB plus the form itself.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 27MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${PARTNERS_SERVER_PORT:8083}

security:
  # Auth remains the issuer of public user access tokens. Partners validates
  # those tokens locally and never calls Auth on the request hot path.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem

  # Partners signs short-lived service tokens with its own key pair. Identity
  # trusts only the public half and only for the identity.merchant scope.
  service-jwt:
    issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/partners/private.pem
    public-key: file:${pavex.keys-dir}/partners/public.pem

  trusted-services:
    shipment:
      # Trust Shipment's dedicated local key, never Auth's private key.
      issuer: ${SHIPMENT_SERVICE_JWT_ISSUER:http://localhost:8084}
      public-key: file:${pavex.keys-dir}/shipment/public.pem
    billing:
      issuer: ${BILLING_SERVICE_JWT_ISSUER:http://localhost:8088}
      public-key: file:${pavex.keys-dir}/billing/public.pem

partners:
  identity:
    service-url: ${IDENTITY_SERVICE_URL:http://identity-service}
  network:
    service-url: ${NETWORK_SERVICE_URL:http://network-service}
  operations:
    service-url: ${OPERATIONS_SERVICE_URL:http://operations-service}
  support:
    mail:
      enabled: ${SUPPORT_MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@pavex.local}

pavex:
  keys-dir: ${user.home}/.pavex/keys
  # Support request attachments are kept in MinIO (compose service "minio"), not in the database.
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:pavex}
    secret-key: ${MINIO_SECRET_KEY:pavex-minio}
    attachments-bucket: ${MINIO_ATTACHMENTS_BUCKET:pavex-attachments}
  gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**

management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
