spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5434/pavex_identity}
    username: ${IDENTITY_DB_USERNAME:pavex}
    password: ${IDENTITY_DB_PASSWORD:pavex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${IDENTITY_SERVER_PORT:8082}

security:
  # Local defaults assume the app is started from the repository root (IntelliJ default).
  # Production overrides key locations in application-prod.yaml.
  # User access tokens and Auth -> Identity service tokens are signed by Auth.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY:file:./auth/.keys/public.pem}

  # Identity owns a separate key pair for Identity -> Auth service tokens.
  service-jwt:
    issuer: ${IDENTITY_SERVICE_JWT_ISSUER:http://localhost:8082}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: ${IDENTITY_SERVICE_JWT_PRIVATE_KEY:file:./identity/.keys/private.pem}
    public-key: ${IDENTITY_SERVICE_JWT_PUBLIC_KEY:file:./identity/.keys/public.pem}

pavex:
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**


management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
