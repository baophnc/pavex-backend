spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pavex_identity}
    username: ${DB_USERNAME:pavex}
    password: ${DB_PASSWORD:pavex}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}


server:
  port: 8081


security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}

    access-token-ttl: PT15M

    refresh-token-ttl: P30D

    private-key: ${JWT_PRIVATE_KEY:file:./.keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:./.keys/public.pem}


identity:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
  security:
    verification-token-ttl: PT24H
    verification-resend-cooldown: PT2M
    password-reset-token-ttl: PT1H
    invitation-token-ttl: PT24H


pavex:
  email:
    from: ${MAIL_FROM:no-reply@pavex.local}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    invitation-url: ${INVITATION_URL:http://localhost:3000/accept-invite}