# Safe to deploy as is: secrets have no default, so a missing one stops startup ("Missing required settings").
# Locally ./scripts/dev-up.sh writes the local values into .env; for a real deployment see
# "Triển khai thật" in docs/PAVEX-TAI-LIEU-TONG-HOP.md.
spring:
  # Settings from .env at the repository root (see .env.example), whether the service is started by
  # scripts/dev-up.sh (from the root) or from the IDE (from the module folder). Variables exported in
  # the shell still win over the file.
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: identity-service

  # Avatar uploads (the service caps them at 2 MB).
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5434/pavex_identity}
    username: ${IDENTITY_DB_USERNAME:pavex}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${IDENTITY_SERVER_PORT:8082}

security:
  # LOCAL ONLY: all launch methods share the same host key directory.
  # User access tokens and Auth -> Identity service tokens are signed by Auth.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem

  # Identity owns a separate key pair for Identity -> Auth service tokens.
  service-jwt:
    issuer: ${IDENTITY_SERVICE_JWT_ISSUER:http://localhost:8082}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/identity/private.pem
    public-key: file:${pavex.keys-dir}/identity/public.pem
    partners:
      issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
      public-key: file:${pavex.keys-dir}/partners/public.pem
    operations:
      issuer: ${OPERATIONS_SERVICE_JWT_ISSUER:http://localhost:8087}
      public-key: file:${pavex.keys-dir}/operations/public.pem

pavex:
  keys-dir: ${user.home}/.pavex/keys

  # Avatars are kept in MinIO (compose service "minio") and served publicly through the gateway.
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:pavex}
    secret-key: ${MINIO_SECRET_KEY}
    avatars-bucket: ${MINIO_AVATARS_BUCKET:pavex-avatars}
    avatar-base-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}/api/v1/avatars

  # Must match Auth so the credential and authorization identity agree.
  # Same first administrator as in Auth (see auth application.yaml); off unless PAVEX_BOOTSTRAPADMIN_ENABLED=true.
  bootstrap-admin:
    enabled: ${PAVEX_BOOTSTRAPADMIN_ENABLED:false}
    id: '00000000-0000-0000-0000-000000000001'
    email: ${PAVEX_BOOTSTRAPADMIN_EMAIL:admin@pavex.com}
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # Address this instance gives the other services. Locally .env sets 127.0.0.1 (scripts/dev-up.sh) so a
    # macOS .local hostname is never advertised; elsewhere it is the detected address of the host or container.
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${spring.cloud.client.ip-address}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.cloud.client.hostname}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/**


management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
