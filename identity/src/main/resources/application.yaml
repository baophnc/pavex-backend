spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5434/pavex_identity}
    username: ${IDENTITY_DB_USERNAME:pavex}
    password: ${IDENTITY_DB_PASSWORD:pavex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${IDENTITY_SERVER_PORT:8082}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: ${JWT_PUBLIC_KEY:file:./.keys/public.pem}

identity:
  internal-token: ${IDENTITY_INTERNAL_TOKEN:}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
