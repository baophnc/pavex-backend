# LOCAL DEVELOPMENT ONLY. Do not deploy with these credentials or bootstrap settings.
spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5434/pavex_identity}
    username: ${IDENTITY_DB_USERNAME:pavex}
    password: ${IDENTITY_DB_PASSWORD:pavex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${IDENTITY_SERVER_PORT:8082}

security:
  # LOCAL ONLY: all launch methods share the same host key directory.
  # User access tokens and Auth -> Identity service tokens are signed by Auth.
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    public-key: file:${pavex.keys-dir}/auth/public.pem

  # Identity owns a separate key pair for Identity -> Auth service tokens.
  service-jwt:
    issuer: ${IDENTITY_SERVICE_JWT_ISSUER:http://localhost:8082}
    ttl: ${SERVICE_JWT_TTL:PT1M}
    private-key: file:${pavex.keys-dir}/identity/private.pem
    public-key: file:${pavex.keys-dir}/identity/public.pem
    partners:
      issuer: ${PARTNERS_SERVICE_JWT_ISSUER:http://localhost:8083}
      public-key: file:${pavex.keys-dir}/partners/public.pem
    operations:
      issuer: ${OPERATIONS_SERVICE_JWT_ISSUER:http://localhost:8087}
      public-key: file:${pavex.keys-dir}/operations/public.pem

pavex:
  keys-dir: ${user.home}/.pavex/keys

  # Must match Auth so the credential and authorization identity agree.
  bootstrap-admin:
    enabled: true
    id: '00000000-0000-0000-0000-000000000001'
    email: admin@pavex.com
  openapi:
    gateway-url: ${PAVEX_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: ${EUREKA_HEALTHCHECK_ENABLED:false}
  instance:
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
    # All services currently run on this machine. Do not advertise macOS .local hostnames.
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/**


management:
  health:
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
