spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pavex_identity}
    username: ${DB_USERNAME:pavex}
    password: ${DB_PASSWORD:pavex}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081


security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}

    access-token-ttl: PT15M

    refresh-token-ttl: P30D

    private-key: ${JWT_PRIVATE_KEY:file:./identity/.keys/private.pem}

    public-key: ${JWT_PUBLIC_KEY:file:./identity/.keys/public.pem}