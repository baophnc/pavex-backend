spring:
  datasource:
    url: jdbc:h2:mem:pavex_identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    discovery:
      enabled: false

security:
  jwt:
    issuer: http://localhost:8081
    public-key: classpath:keys/test-public.pem
  service-jwt:
    issuer: http://localhost:8082
    ttl: PT1M
    private-key: classpath:keys/test-private.pem
    public-key: classpath:keys/test-public.pem

eureka:
  client:
    enabled: false
