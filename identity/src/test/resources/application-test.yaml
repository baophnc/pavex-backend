spring:
  datasource:
    url: jdbc:h2:mem:pavex_identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    discovery:
      enabled: false

security:
  jwt:
    issuer: http://localhost:8081
    public-key: classpath:keys/test-public.pem

identity:
  internal-token: test-internal-token

eureka:
  client:
    enabled: false
